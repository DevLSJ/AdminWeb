# ─────────────────────────────────────────────
# Application
# ─────────────────────────────────────────────
spring.application.name=guard-kms

# ─────────────────────────────────────────────
# DataSource (PostgreSQL)
# ─────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dguard_kms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dguard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 운영 DB 스키마 버전 관리 (기존 비어 있지 않은 스키마는 0 버전으로 기준 설정)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-migration-naming=true

# ─────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────
server.port=8080

# ─────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ─────────────────────────────────────────────
# KMS 마스터키 & 무결성
# ─────────────────────────────────────────────
kms.master.passphrase=${KMS_MASTER_PASSPHRASE}
kms.integrity.hmac-key=${INTEGRITY_HMAC_KEY}

# PBKDF2 설정 (iterations 환경변수로 조정 가능)
kms.master.pbkdf2.iterations=${KMS_PBKDF2_ITERATIONS:210000}
kms.master.pbkdf2.key-length=256
kms.master.pbkdf2.algorithm=PBKDF2WithHmacSHA256
kms.password.pbkdf2.iterations=${PASSWORD_PBKDF2_ITERATIONS:210000}

# ─────────────────────────────────────────────
# SpringDoc OpenAPI (Swagger UI)
# ─────────────────────────────────────────────
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.enabled=true
# Nginx /api/* 프록시를 통한 접근 시 올바른 서버 URL 표시
springdoc.swagger-ui.url=/api/api-docs

# ─────────────────────────────────────────────
# Actuator (헬스체크 — Docker healthcheck 용)
# ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
