spring.datasource.url=jdbc:h2:mem:dguard_kms_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
kms.master.passphrase=test-master-passphrase-with-32-characters
kms.master.pbkdf2.iterations=210000
kms.password.pbkdf2.iterations=210000
kms.integrity.hmac-key=test-integrity-hmac-key-with-32-bytes
jwt.secret=test-jwt-secret-with-at-least-32-characters
