name: Build & Deploy

on:
  push:
    branches:
      - main          # main 브랜치 push 시 자동 배포
  workflow_dispatch:  # 수동 실행 허용

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/dguard-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/dguard-frontend

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 백엔드 빌드 & Docker 이미지 Push
  # ─────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build with Gradle (skip tests)
        run: ./gradlew bootJar --no-daemon -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 2: 프론트엔드 빌드 & Docker 이미지 Push
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 3: 서버 배포 (SSH)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]  # 두 빌드 완료 후 실행

    steps:
      - name: Checkout (docker-compose.yml 전송용)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/dguard/app"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/dguard/app

            # .env 파일 존재 확인 (없으면 배포 중단)
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found. Create it from .env.example first."
              exit 1
            fi

            # 이미지 태그 업데이트
            export IMAGE_TAG=${{ github.sha }}
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env

            # 최신 이미지 Pull 및 재시작
            docker compose pull
            docker compose up -d --remove-orphans

            # 사용하지 않는 이미지 정리
            docker image prune -f

            echo "✅ Deploy completed: $IMAGE_TAG"
