name: Build & Deploy

on:
  push:
    branches:
      - main          # main 브랜치 push 시 자동 배포
  workflow_dispatch:  # 수동 실행 허용

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/dguard-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/dguard-frontend

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 백엔드 빌드 & Docker 이미지 Push
  # ─────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build with Gradle (skip tests)
        run: ./gradlew bootJar --no-daemon -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 2: 프론트엔드 빌드 & Docker 이미지 Push
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 3: 서버 배포 (Self-hosted Runner)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: [build-backend, build-frontend]  # 두 빌드 완료 후 실행

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy locally
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          install -m 600 docker-compose.yml /home/dguard/app/docker-compose.yml
          cd /home/dguard/app

          if [ ! -f .env ]; then
            echo "ERROR: .env file not found. Create it from .env.example first."
            exit 1
          fi

          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
          else
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
          fi

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

          echo "Deploy completed: $IMAGE_TAG"
